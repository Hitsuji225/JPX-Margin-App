name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          choco install poppler -y --no-progress
      - name: Build EXE
        shell: pwsh
        run: |
          $tool = (Get-Command pdftotext.exe -ErrorAction Stop).Source
          $bin = Split-Path $tool
          New-Item -ItemType Directory -Force poppler | Out-Null
          Copy-Item "$bin\*" poppler -Recurse -Force
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name JPX-Margin-App --add-data "poppler;poppler" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: JPX-Windows-EXE
          path: dist/*.exe
